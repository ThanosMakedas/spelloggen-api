<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061618"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Two nested hexagons -->
  <g fill="none" filter="url(#glow)">
    <polygon points="480,70 566.6,120 566.6,220 480,270 393.4,220 393.4,120" stroke="#f0c35a" stroke-width="3"/>
    <polygon points="480,110 532,140 532,200 480,230 428,200 428,140" stroke="#2ee6d6" stroke-width="2"/>
  </g>
  <text x="40" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#fff6dd" filter="url(#glow)">LEAGUE</text>
  <text x="43" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#f0c35a">OF LEGENDS</text>
</svg>
