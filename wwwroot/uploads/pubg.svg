<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1405"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- The shrinking play zone -->
  <g fill="none" filter="url(#glow)">
    <circle cx="470" cy="150" r="150" stroke="#ffb020" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="490" cy="165" r="95" stroke="#ffb020" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="505" cy="175" r="45" stroke="#ffb020" stroke-width="3"/>
  </g>
  <text x="40" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#fff4dd" filter="url(#glow)">PUBG</text>
  <text x="43" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#ffb020">BATTLEGROUNDS</text>
</svg>
